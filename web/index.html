<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto BG Remover AI</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>✨ Auto BG Remover</h1>
        <p>画像を入れるだけで、AIが人物を自動で切り抜きます。</p>
      </header>

      <main>
        <div id="drop-area" class="drop-area">
          <div class="drop-content">
            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p class="drop-text">ここに画像をドラッグ＆ドロップ</p>
            <p class="drop-subtext">またはクリックしてファイルを選択</p>
          </div>
          <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" hidden />
        </div>

        <div id="loading-area" class="loading-area hidden">
          <div class="spinner"></div>
          <p id="loading-text">AIモデルを準備中...</p>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <div id="result-area" class="result-area hidden">
          <div class="comparison-container">
            <div class="image-box">
              <h3>Original</h3>
              <img id="original-image" src="" alt="Original" />
            </div>
            <div class="image-box checkerboard">
              <h3>Result</h3>
              <img id="result-image" src="" alt="Result" />
            </div>
          </div>
          <div class="action-buttons">
            <button id="download-btn" class="btn primary-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              ダウンロード
            </button>
            <button id="reset-btn" class="btn secondary-btn">別の画像を切り抜く</button>
          </div>
        </div>
      </main>
      
      <footer>
        <p>100% Client-side processing. Your images never leave your device.</p>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
